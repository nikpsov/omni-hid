name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Verify
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build OmniHID Solution
        run: |
          msbuild OmniHid.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Verify CLI Output
        shell: pwsh
        run: |
          $binaries = @(
            "bin\omni-hid.exe",
            "bin\OmniHid.Core.dll"
          )
          foreach ($bin in $binaries) {
            if (-not (Test-Path $bin)) {
              throw "Required binary not found: $bin"
            }
            Write-Host "Verified: $bin"
          }
          bin\omni-hid.exe --help
